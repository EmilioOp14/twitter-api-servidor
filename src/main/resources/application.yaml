spring:
    application:
        name: ApiTwitter1
        author: Emilio

    datasource:
        url: jdbc:mysql://localhost:3306/social_network?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
        username: root
        password: root

    sql:
        init:
            # Indica las ubicaciones de los scripts de inicializacion de BBDD en caso de que el campo anterior esté en true.
            data-locations:
            - classpath:db/schema.sql
            - classpath:db/data.sql
            #La siguiente propiedad indica cuando crear la base de datos. Si está en always la crea siempre, si está en never nunca.
            mode: ${dbinitmode:never}

    jpa:
        hibernate:
            ddl-auto: validate

